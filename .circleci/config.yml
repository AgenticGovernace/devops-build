# CircleCI is the primary CI/CD pipeline for this repository.
# The previous GitHub Actions workflows (.github/workflows/ci.yml and
# qodana_code_quality.yml) have been removed in favor of this config.
#
# Workflows:
#   - commit-checks: blocking gate on every branch — lint + unit tests,
#     followed by a production build.
#     NOTE: `npm run typecheck` is intentionally NOT part of the gate:
#     typecheck was never run in the old GitHub Actions CI and currently
#     fails with ~40 pre-existing errors (React 19 JSX namespace usage,
#     untyped vitest globals in tests, store.tsx action-type mismatches,
#     vitest.config.ts overload). Re-add it to the gate — i.e. switch the
#     Validate step back to `npm run validate` — once those are fixed.
#   - e2e-advisory:  Playwright end-to-end tests. CircleCI workflows have
#     no per-job continue-on-error, so e2e runs in its own workflow to
#     keep it ADVISORY: a red e2e-advisory workflow must not block merges.
#
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

commands:
  install-deps:
    description: Restore the npm cache and install dependencies with npm ci
    steps:
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
            - npm-deps-v1-
      - run:
          name: Install dependencies
          command: npm run install:ci
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  validate:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - install-deps
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Unit tests
          command: npm run test:run
      - run:
          name: Build
          command: npm run build
      - store_artifacts:
          path: dist
          destination: dist

  e2e:
    docker:
      - image: cimg/node:20.19-browsers
    steps:
      - checkout
      - install-deps
      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps chromium
      - run:
          name: Run Playwright end-to-end tests
          command: npm run test:e2e
      - store_artifacts:
          path: playwright-report
          destination: playwright-report

workflows:
  # Blocking checks on every branch.
  commit-checks:
    jobs:
      - validate

  # Advisory only — failures here should NOT block merges. Kept as a
  # separate workflow because CircleCI has no per-job continue-on-error.
  e2e-advisory:
    jobs:
      - e2e
